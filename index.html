<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1> 
        <input type="text" id="expenseName" placeholder="Enter expense name"> <input type="number"
            id="expenseAmount" placeholder="Enter amount" min="0.01" step="0.01"> 
            <button onclick="addExpense()">Add
        Expense</button>
        <div class="total">
            <h2>Total: ₹<span id="totalAmount">0.00</span></h2>
        </div>
        <h2>Expense List</h2>
        <ul id="expenseList"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
